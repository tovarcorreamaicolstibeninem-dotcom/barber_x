<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
  <title id="title">Modelo entidad-relación de BARBER X</title>
  <desc id="description">Diagrama actualizado con diez tablas, sin la tabla heredada de recepcionistas, y sus claves foráneas.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .table { fill: #fff; stroke: #cbd3df; stroke-width: 2; }
      .heading { fill: #24364b; }
      .name { fill: #fff; font-size: 19px; font-weight: 700; }
      .field { fill: #354357; font-size: 15px; }
      .key { fill: #ad7c22; font-size: 13px; font-weight: 800; }
      .rule { stroke: #dce2e9; stroke-width: 1; }
      .relation { fill: none; stroke: #78889a; stroke-width: 3; }
      .rel-label { fill: #526579; font-size: 13px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1600" height="1160" rx="22" fill="#f2f5f8"/>
  <rect x="28" y="26" width="1544" height="98" rx="16" fill="#1d2b3c"/>
  <text x="60" y="68" fill="#fff" font-size="27" font-weight="750">BARBER X · MODELO ENTIDAD-RELACIÓN</text>
  <text x="60" y="98" fill="#c6d1de" font-size="15">Base de datos barber_x · 10 tablas · MySQL / InnoDB</text>
  <g transform="translate(1188 54)">
    <rect width="18" height="18" rx="4" fill="#edc775"/>
    <text x="28" y="14" fill="#eef2f6" font-size="14">Clave primaria (PK)</text>
    <rect x="190" width="18" height="18" rx="4" fill="#90c6dd"/>
    <text x="218" y="14" fill="#eef2f6" font-size="14">Clave foránea (FK)</text>
  </g>

  <!-- Relaciones entre cliente, citas, barberos, servicios y calidad. -->
  <path class="relation" d="M395 235 H440"/>
  <text class="rel-label" x="396" y="222">1:N</text>
  <path class="relation" d="M830 310 H790"/>
  <text class="rel-label" x="791" y="297">1:N</text>
  <path class="relation" d="M1180 235 H1220"/>
  <text class="rel-label" x="1180" y="222">1:1</text>
  <path class="relation" d="M220 405 V485"/>
  <text class="rel-label" x="229" y="451">1:N</text>
  <path class="relation" d="M615 420 V485"/>
  <text class="rel-label" x="625" y="461">1:N</text>
  <path class="relation" d="M830 560 H790"/>
  <text class="rel-label" x="791" y="547">1:N</text>
  <text x="60" y="814" fill="#728093" font-size="14">Las tablas sin línea directa no tienen claves foráneas declaradas en el esquema.</text>

  <g transform="translate(50 155)">
    <rect class="table" width="345" height="250" rx="12"/>
    <path class="heading" d="M12 0 H333 Q345 0 345 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">cliente</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_clte</text>
    <path class="rule" d="M16 91 H329"/>
    <text class="field" x="18" y="116">nombre</text><path class="rule" d="M16 128 H329"/>
    <text class="field" x="18" y="153">apellido</text><path class="rule" d="M16 165 H329"/>
    <text class="field" x="18" y="190">telefono</text><path class="rule" d="M16 202 H329"/>
    <text class="field" x="18" y="227">email · password_hash · fecha_registro</text>
  </g>

  <g transform="translate(440 155)">
    <rect class="table" width="350" height="265" rx="12"/>
    <path class="heading" d="M12 0 H338 Q350 0 350 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">cita</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_cita</text>
    <text class="key" x="170" y="78">FK</text><text class="field" x="207" y="78">id_clte</text>
    <path class="rule" d="M16 91 H334"/>
    <text class="key" x="18" y="116">FK</text><text class="field" x="56" y="116">id_barbero</text>
    <path class="rule" d="M16 129 H334"/>
    <text class="field" x="18" y="154">fecha_hora · estado · metodo_pago</text>
    <path class="rule" d="M16 167 H334"/>
    <text class="field" x="18" y="192">precio · notas</text>
  </g>

  <g transform="translate(830 155)">
    <rect class="table" width="350" height="250" rx="12"/>
    <path class="heading" d="M12 0 H338 Q350 0 350 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">barbero</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_barbero</text>
    <path class="rule" d="M16 91 H334"/>
    <text class="field" x="18" y="116">nombre · apellido · telefono</text>
    <path class="rule" d="M16 129 H334"/>
    <text class="field" x="18" y="154">email · especialidad · activo</text>
  </g>

  <g transform="translate(1220 155)">
    <rect class="table" width="330" height="175" rx="12"/>
    <path class="heading" d="M12 0 H318 Q330 0 330 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">cuenta_barbero</text>
    <text class="key" x="18" y="78">PK/FK</text><text class="field" x="76" y="78">id_barbero</text>
    <path class="rule" d="M16 91 H314"/>
    <text class="field" x="18" y="116">password_hash · autorizada_por_admin</text>
    <path class="rule" d="M16 129 H314"/>
    <text class="field" x="18" y="154">creado_en</text>
  </g>

  <g transform="translate(50 485)">
    <rect class="table" width="345" height="285" rx="12"/>
    <path class="heading" d="M12 0 H333 Q345 0 345 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">registro_calidad</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_registro</text>
    <path class="rule" d="M16 91 H329"/>
    <text class="field" x="18" y="116">tipo · origen · severidad · estado</text>
    <path class="rule" d="M16 129 H329"/>
    <text class="field" x="18" y="154">titulo · detalle</text>
    <path class="rule" d="M16 167 H329"/>
    <text class="key" x="18" y="192">FK</text><text class="field" x="56" y="192">id_cliente (opcional)</text>
    <path class="rule" d="M16 205 H329"/>
    <text class="field" x="18" y="230">creado_en · actualizado_en</text>
  </g>

  <g transform="translate(440 485)">
    <rect class="table" width="350" height="195" rx="12"/>
    <path class="heading" d="M12 0 H338 Q350 0 350 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">cita_servicio</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_cs</text>
    <path class="rule" d="M16 91 H334"/>
    <text class="key" x="18" y="116">FK</text><text class="field" x="56" y="116">id_cita · id_serv</text>
    <path class="rule" d="M16 129 H334"/>
    <text class="field" x="18" y="154">cantidad · precio</text>
  </g>

  <g transform="translate(830 485)">
    <rect class="table" width="350" height="225" rx="12"/>
    <path class="heading" d="M12 0 H338 Q350 0 350 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">servicio</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_serv</text>
    <path class="rule" d="M16 91 H334"/>
    <text class="field" x="18" y="116">nombre · descripcion</text>
    <path class="rule" d="M16 129 H334"/>
    <text class="field" x="18" y="154">precio · duracion · activo</text>
  </g>

  <g transform="translate(1220 485)">
    <rect class="table" width="330" height="175" rx="12"/>
    <path class="heading" d="M12 0 H318 Q330 0 330 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">manual_usuario</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_manual</text>
    <path class="rule" d="M16 91 H314"/>
    <text class="field" x="18" y="116">titulo · contenido</text>
    <path class="rule" d="M16 129 H314"/>
    <text class="field" x="18" y="154">actualizado_en</text>
  </g>

  <g transform="translate(440 850)">
    <rect class="table" width="350" height="195" rx="12"/>
    <path class="heading" d="M12 0 H338 Q350 0 350 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">video_tutorial</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_video</text>
    <path class="rule" d="M16 91 H334"/>
    <text class="field" x="18" y="116">titulo · descripcion · archivo</text>
    <path class="rule" d="M16 129 H334"/>
    <text class="field" x="18" y="154">actualizado_en</text>
  </g>

  <g transform="translate(830 850)">
    <rect class="table" width="350" height="235" rx="12"/>
    <path class="heading" d="M12 0 H338 Q350 0 350 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="name" x="18" y="32">reporte_generado</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="56" y="78">id_reporte</text>
    <path class="rule" d="M16 91 H334"/>
    <text class="field" x="18" y="116">generado_en · generado_por</text>
    <path class="rule" d="M16 129 H334"/>
    <text class="field" x="18" y="154">total_citas · total_clientes</text>
    <path class="rule" d="M16 167 H334"/>
    <text class="field" x="18" y="192">ingresos · datos_json</text>
  </g>
</svg>
